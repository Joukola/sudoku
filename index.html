let lang='fi',puzzle=[],solution=[],values=[],notes=[],selected=-1,noteMode=false,autoNotes=false,refineNotes=false,notesVisible=false,manualExcluded=Array.from({length:81},()=>[]),activeDigit=0,history=[],future=[],seconds=0,timer,singleHighlights=[],solvedAnnounced=false;

function solve(b,limit=1,random=false){let count=0,first=null;function rec(){let idx=-1,opts=null;for(let i=0;i<81;i++)if(!b[i]){let c=candidates(b,i);if(!c.length)return;if(!opts||c.length<opts.length){idx=i;opts=c;if(c.length===1)break}}if(idx<0){count++;if(!first)first=[...b];return}for(let n of random?shuffle(opts):opts){b[idx]=n;rec();if(count>=limit){b[idx]=0;return}b[idx]=0}}rec();return {count,first}}

function reduceBoxSingles(){

 // Evaluate all box-only positions from the unchanged board, before editing notes.
 // Never let a later digit overwrite an earlier forced digit in the same cell.

 for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){
   const cells=[];
   for(let r=br*3;r<br*3+3;r++)for(let col=bc*3;col<bc*3+3;col++)cells.push(r*9+col);
   for(let n=1;n<=9;n++){
     if(cells.some(i=>values[i]===n))continue;
     const possible=cells.filter(i=>!values[i]&&candidates(values,i).includes(n));
     if(possible.length===1)forced[possible[0]].add(n);
   }

   if(values[i]||forced[i].size!==1)continue;
   const n=[...forced[i]][0];

   if((notes[i]||[]).includes(n))notes[i]=[n];

function removeCandidate(i,n){if(i<0||i>=81||values[i]||n<1||n>9)return;const a=notes[i]||[];if(!a.includes(n))return;notes[i]=a.filter(x=>x!==n);if(!manualExcluded[i].includes(n))manualExcluded[i].push(n);notesVisible=true;render();save()}

function refineCandidateNotes(silent=false){
 // Derive deductions from the actual board, never from already reduced pencil marks.
 // A removed mark must not become evidence for removing another mark.
 const before=notes.map(a=>[...a]);

 const boxes=Array.from({length:9},(_,b)=>Array.from({length:9},(_,k)=>(Math.floor(b/3)*3+Math.floor(k/3))*9+(b%3)*3+k%3));

 for(const [kind,units] of [['box',boxes],['row',rows],['col',cols]]){
  for(const unit of units)for(let n=1;n<=9;n++){
   if(unit.some(i=>values[i]===n))continue;
   const places=unit.filter(i=>legal[i].has(n));
   if(places.length<2)continue;
   const targets=kind==='box'?[rows[Math.floor(places[0]/9)],cols[places[0]%9]]:[boxes[Math.floor(Math.floor(places[0]/9)/3)*3+Math.floor((places[0]%9)/3)]];
   for(const target of targets){
    if(!places.every(i=>target.includes(i)))continue;

   }

   ?before[i].filter(n=>legal[i].has(n))

 }

}

$('numbers').replaceChildren();for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(!noteMode&&values.filter(v=>v===n).length>=9)return;if(activeDigit!==n)selected=-1;activeDigit=n;if(selected>=0&&!puzzle[selected]&&!values[selected])change(selected,n);else render()};$('numbers').append(b)}
$('autonotes').onclick=()=>{for(let i=0;i<81;i++)notes[i]=values[i]?[]:candidates(values,i);autoNotes=false;refineNotes=false;notesVisible=true;render();save()};$('hide-notes').onclick=()=>{notesVisible=!notesVisible;render();save()};$('note').onclick=()=>{noteMode=!noteMode;if(noteMode){notesVisible=true;if(activeDigit===-1)activeDigit=0}render();save()};const helpContent={"fi":[["Pelaaminen","Valitse numero oikealta ja kosketa ruutua. Uusi peli aloittaa uuden sudokun. Vihje täyttää yhden ruudun."],["Merkintöjen lisääminen","Tee merkintä ON: valitse numero ja kosketa ruutua lisätäksesi tai poistaaksesi pienen merkinnän. OFF: tavallinen numerosyöttö."],["Merkintöjen näkyvyys ja poisto","Näytä/Piilota merkinnät muuttaa vain näkyvyyttä. ⌫ poistaa numeron tai kosketetun pienen merkinnän."],["Automaattiset merkinnät","Painallus täyttää mahdolliset ehdokkaat. Näytä/Piilota merkinnät säätää näkyvyyttä. Merkinnät eivät päivity itsestään."],["Tarkistukset","Tarkista numerot näyttää virheelliset numerot. Tarkista merkinnät ilmoittaa virheellisten nykyisten merkintöjen määrän ja poistaa ne; puuttuvia ei lisätä. Syväanalyysi poistaa myös lukittujen ehdokkaiden ja 3×3-alueen sekä vaaka- ja pystyrivien parien ja kolmikoiden perusteella poissuljetut merkinnät. Analyysi tehdään vain painettaessa. Jos tarkistuksen jälkeen ruuduissa on vain yksi sallittu merkintä, peli kysyy täytetäänkö ne numeroiksi."]],"hu":[["Játék","Válassz számot a jobb oldalon, majd érints meg egy cellát. Az Új játék új feladványt indít."],["Jelölések","A Jelölés hozzáadása ON módban kis jelöléseket adhatsz hozzá vagy törölhetsz. OFF módban számokat írsz be."],["Megjelenítés és törlés","A megjelenítés csak a láthatóságot változtatja. A ⌫ számmal vagy kis jelöléssel használható."],["Automatikus jelölések","Megnyomásra kitölti a lehetséges jelöléseket. A megjelenítést a Jelölések mutatása/elrejtése szabályozza. Nincs automatikus frissítés."],["Ellenőrzés","A jelölések ellenőrzése jelzi és törli a hibás meglévő jelöléseket, nem pótolja a hiányzókat. A Mélyelemzés a rögzített jelöltek, valamint a 3×3-as mezők, sorok és oszlopok párjai és hármasai alapján is szűkít. Csak megnyomáskor fut. Ha az ellenőrzés után egy mezőben csak egy jelölt marad, a játék rákérdez annak beírására."]],"en":[["Playing","Select a number on the right and tap a cell. New game starts a new puzzle."],["Adding marks","Add mark ON lets you add or remove small pencil marks. OFF enters full numbers."],["Showing and erasing","Show/Hide marks only changes visibility. ⌫ removes a number or a tapped small mark."],["Automatic marks","Press to fill candidates from the current board. Show/Hide marks controls visibility. Marks do not update automatically."],["Checking","Check marks reports and removes invalid existing marks, without adding missing marks. Deep analysis also eliminates candidates using locked candidates and naked pairs and triples in 3×3 boxes, rows and columns. Both run only when pressed. After checking, the game asks whether to fill cells with a single legal remaining mark."]]};$('help-notes').onclick=()=>{const modal=$('notes-help'),body=$('help-body');body.replaceChildren();$('help-title').textContent=({fi:'Sudokun ohje',hu:'Sudoku útmutató',en:'Sudoku help'})[lang];for(const [heading,desc] of helpContent[lang]){const section=document.createElement('section'),h=document.createElement('h3'),p=document.createElement('p');h.textContent=heading;p.textContent=desc;section.append(h,p);body.append(section)}modal.hidden=false};$('close-help').onclick=()=>{$('notes-help').hidden=true};$('notes-help').addEventListener('pointerdown',e=>{if(e.target.id==='notes-help')$('notes-help').hidden=true});$('refine-notes').onclick=()=>{

function askFillSingles(){

 const legal=values.map((v,i)=>new Set(v?[]:candidates(values,i)));
 const boxes=Array.from({length:9},(_,b)=>Array.from({length:9},(_,k)=>(Math.floor(b/3)*3+Math.floor(k/3))*9+(b%3)*3+k%3));
 const rows=Array.from({length:9},(_,r)=>Array.from({length:9},(_,k)=>r*9+k));
 const cols=Array.from({length:9},(_,col)=>Array.from({length:9},(_,r)=>r*9+col));
 const removals=Array.from({length:81},()=>new Set());
 const mark=(i,n)=>{if(legal[i].has(n))removals[i].add(n)};
 // Locked candidates: pointing and claiming, with no chained assumptions.
 for(const [kind,units] of [['box',boxes],['row',rows],['col',cols]])
  for(const unit of units)for(let n=1;n<=9;n++){
   if(unit.some(i=>values[i]===n))continue;
   const places=unit.filter(i=>legal[i].has(n));
   if(places.length<2)continue;
   const targets=kind==='box'?[rows[Math.floor(places[0]/9)],cols[places[0]%9]]:[boxes[Math.floor(Math.floor(places[0]/9)/3)*3+Math.floor((places[0]%9)/3)]];
   for(const target of targets)if(places.every(i=>target.includes(i)))
    for(const i of target)if(!unit.includes(i))mark(i,n);
  }
 // Naked pairs and triples in boxes, rows and columns.
 for(const unit of [...boxes,...rows,...cols]){
  const cells=unit.filter(i=>!values[i]&&legal[i].size>=2&&legal[i].size<=3);
  for(const size of [2,3]){
   const choose=(start,chosen)=>{
    if(chosen.length===size){
     const union=new Set(chosen.flatMap(i=>[...legal[i]]));
     if(union.size!==size)return;
     // Exactly these cells in the box may contain only the union.
     const confined=unit.filter(i=>!values[i]&&legal[i].size>0&&[...legal[i]].every(n=>union.has(n)));
     if(confined.length!==size||!chosen.every(i=>confined.includes(i)))return;
     for(const i of unit)if(!chosen.includes(i))for(const n of union)mark(i,n);
     return;
    }
    for(let k=start;k<=cells.length-(size-chosen.length);k++)choose(k+1,[...chosen,cells[k]]);
   };
   choose(0,[]);
  }
 }
 // Hidden singles in every row, column and 3x3 box.
 // A digit with exactly one legal location in a unit is forced in that cell.
 const forced=Array.from({length:81},()=>new Set());
 for(const unit of [...rows,...cols,...boxes])for(let n=1;n<=9;n++){
  if(unit.some(i=>values[i]===n))continue;
  const places=unit.filter(i=>legal[i].has(n));
  if(places.length===1)forced[places[0]].add(n);
 }
 for(let i=0;i<81;i++)if(forced[i].size===1)
  for(const n of legal[i])if(!forced[i].has(n))mark(i,n);
 let removed=0;
 for(let i=0;i<81;i++){
  const old=notes[i]||[];
  notes[i]=old.filter(n=>legal[i].has(n)&&!removals[i].has(n));
  removed+=old.length-notes[i].length;
 }
 notesVisible=true;render();save();
 $('status').textContent=({fi:'Syväanalyysi: poistettu '+removed+' merkintää',hu:'Mélyelemzés: '+removed+' jelölés törölve',en:'Deep analysis: '+removed+' marks removed'})[lang];askFillSingles();
};$('clear-cell').onclick=()=>{activeDigit=-1;render()};


$('hint').onclick=()=>{let i=selected>=0&&!puzzle[selected]&&values[selected]!==solution[selected]?selected:values.findIndex((v,j)=>v!==solution[j]);if(i>=0){selected=i;let was=noteMode;noteMode=false;change(i,solution[i]);noteMode=was;render()}};
$('check').onclick=()=>{showErrors=true;render();$('status').textContent=values.some((v,i)=>v&&v!==solution[i])?dict[lang].wrong:dict[lang].ok;completed()};
// Lightweight sounds generated locally; no audio files or network needed.
let soundContext=null;
function playSound(kind){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!soundContext)soundContext=new AC();
  if(soundContext.state==='suspended')soundContext.resume();
  const t=soundContext.currentTime;
  const notes=kind==='solved'?[523,659,784,1047]:kind==='empty'?[350]:[650];
  notes.forEach((hz,j)=>{
   const start=t+j*(kind==='solved'?.12:0);
   const osc=soundContext.createOscillator(),gain=soundContext.createGain();
   osc.type=kind==='solved'?'sine':'triangle';osc.frequency.value=hz;
   gain.gain.setValueAtTime(.0001,start);
   gain.gain.exponentialRampToValueAtTime(kind==='solved'?.12:.055,start+.012);
   gain.gain.exponentialRampToValueAtTime(.0001,start+(kind==='solved'?.22:.075));
   osc.connect(gain);gain.connect(soundContext.destination);
   osc.start(start);osc.stop(start+(kind==='solved'?.24:.085));
  });
 }catch(e){}
}
document.addEventListener('pointerdown',e=>{
 if(e.target.closest('button,select')&&!e.target.closest('.cell'))playSound('tap');
},{passive:true});
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9'){activeDigit=+e.key;change(selected,+e.key)}else if(e.key==='Backspace'||e.key==='Delete')change(selected,0);else if(selected>=0&&e.key.startsWith('Arrow')){e.preventDefault();selected=Math.max(0,Math.min(80,selected+({ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key]||0)));render()}});
// Always start a fresh puzzle on app launch; never restore old notes or a previous board.
newGame();
lang=localStorage.getItem('sudoku-lang')||'fi';if(!dict[lang])lang='fi';translate();render();timer=setInterval(()=>{seconds++;save()},1000);
</script>
<script>
/* Two-level right drawer. Existing game buttons and handlers remain intact. */
(function(){
 const main=document.querySelector('main'),game=main.querySelector('.game-area');
 const panel=document.createElement('aside');panel.className='side-panel';panel.id='tools-panel';
 const heading=document.createElement('h2');panel.append(heading);
 const basic=document.createElement('section'),advanced=document.createElement('section');
 basic.className='menu-level';advanced.className='menu-level';advanced.hidden=true;
 const more=document.createElement('button');more.type='button';more.className='menu-nav';more.id='menu-more';
 const back=document.createElement('button');back.type='button';back.className='menu-nav';back.id='menu-back';
 advanced.append(back);panel.append(basic,advanced);
 const backdrop=document.createElement('div');backdrop.className='side-backdrop';backdrop.hidden=true;
 const tab=document.createElement('button');tab.type='button';tab.className='side-tab';tab.id='tools-tab';tab.textContent='‹';tab.setAttribute('aria-controls','tools-panel');tab.setAttribute('aria-expanded','false');
 const quick=document.createElement('div');quick.className='quick-controls';quick.append(document.getElementById('note'));game.after(quick);
 const toolbar=main.querySelector('.toolbar');basic.append(toolbar);
 const actionButtons=[...main.querySelectorAll('.actions button')];
 const basicIds=new Set(['check','hint','help-notes']);
 const advancedIds=new Set(['hide-notes','autonotes','refine-notes','deep-notes']);
 const basicActions=document.createElement('div');basicActions.className='actions';
 const advancedActions=document.createElement('div');advancedActions.className='actions';
 actionButtons.forEach(button=>{if(basicIds.has(button.id))basicActions.append(button);else if(advancedIds.has(button.id))advancedActions.append(button);else basicActions.append(button)});
 basic.append(basicActions,more);advanced.append(advancedActions);
 main.querySelectorAll('.actions').forEach(el=>el.remove());
 document.body.append(backdrop,panel,tab);
 let level=1;
 const labels={
 fi:{basic:'Perusvalinnat',advanced:'Merkinnät ja analyysi',more:'Lisätoiminnot ›',back:'‹ Takaisin',open:'Avaa valikko',close:'Sulje valikko'},
 hu:{basic:'Alapfunkciók',advanced:'Jelölések és elemzés',more:'További funkciók ›',back:'‹ Vissza',open:'Menü megnyitása',close:'Menü bezárása'},
 en:{basic:'Basic options',advanced:'Notes and analysis',more:'More options ›',back:'‹ Back',open:'Open menu',close:'Close menu'}
 };
 function localize(){const l=labels[typeof lang==='string'?lang:'fi']||labels.fi;heading.textContent=level===1?l.basic:l.advanced;more.textContent=l.more;back.textContent=l.back;tab.setAttribute('aria-label',panel.classList.contains('open')?l.close:l.open)}
 function setLevel(n){level=n;basic.hidden=n!==1;advanced.hidden=n!==2;localize()}
 function toggle(open){panel.classList.toggle('open',open);backdrop.hidden=!open;tab.textContent=open?'›':'‹';tab.setAttribute('aria-expanded',String(open));if(open)setLevel(1);else localize()}
 tab.addEventListener('click',()=>toggle(!panel.classList.contains('open')));
 backdrop.addEventListener('click',()=>toggle(false));
 more.addEventListener('click',()=>setLevel(2));back.addEventListener('click',()=>setLevel(1));
 document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});
 panel.addEventListener('click',e=>{if(e.target.closest('#new'))toggle(false)});
 document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>queueMicrotask(localize)));
 localize();
})();
</script>
