</style></head><body><main><h1 id="title">Siskon parempi sudoku</h1><div class="sub">Testiversio 0.5.3</div><div class="toolbar"><select id="lang" aria-label="Language"><option value="fi">Suomi</option><option value="hu">Magyar</option><option value="en">English</option></select><select id="difficulty"><option value="easy">Helppo</option><option value="medium">Keskitaso</option><option value="hard">Vaikea</option><option value="expert">Erittäin vaikea</option></select><button id="new">Uusi peli</button></div><div id="new-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="new-confirm-text"><div class="confirm-panel"><span id="new-confirm-text">Aloitetaanko uusi peli?</span><div class="confirm-buttons"><button id="new-yes">Aloita uusi</button><button id="new-no">Peruuta</button></div></div></div><div class="status" id="status"></div><div class="game-area"><div class="board" id="board" role="grid" aria-label="Sudoku"></div><div class="number-side"><div class="nums" id="numbers"></div><button id="clear-cell" aria-label="Tyhjennä ruutu">⌫</button></div></div><div class="actions"><button id="hide-notes">Näytä merkinnät</button><button id="note">Lisää merkintä</button><button id="autonotes">Automaattiset merkinnät</button><button id="check">Tarkista numerot</button><button id="refine-notes">Tarkista merkinnät</button></div><div class="actions"><button id="help-notes">Ohje</button><button id="hint">Vihje</button></div><div id="notes-help" hidden></div><div class="footer" id="footer">Uusi peli jokaisella käynnistyksellä</div></main>
<script>
const dict={fi:{title:'Siskon parempi sudoku',new:'Uusi peli',easy:'Helppo',medium:'Keskitaso',hard:'Vaikea',expert:'Erittäin vaikea',erase:'Pyyhi',note:'Lisää merkintä',refine:'Tarkista merkinnät',autonotes:'Autom. merkinnät',pastels:'Numerovärit',undo:'Kumoa',redo:'Tee uudelleen',hint:'Vihje',check:'Tarkista numerot',save:'Uusi peli jokaisella käynnistyksellä',done:'Sudoku ratkaistu!',ok:'Ei ristiriitoja',wrong:'Virheellisiä numeroita',confirm:'Aloitetaanko uusi peli?'},hu:{title:'Sisko jobb sudokuje',new:'Új játék',easy:'Könnyű',medium:'Közepes',hard:'Nehéz',expert:'Nagyon nehéz',erase:'Törlés',note:'Jelölés hozzáadása',refine:'Jegyzetek szűrése',autonotes:'Automatikus jegyzetek',pastels:'Színes számok',undo:'Visszavonás',redo:'Újra',hint:'Tipp',check:'Számok ellenőrzése',save:'Új játék minden indításkor',done:'Sudoku megoldva!',ok:'Nincs ütközés',wrong:'Hibás számok',confirm:'Új játék induljon?'},en:{title:"Sisko's Better Sudoku",new:'New game',easy:'Easy',medium:'Medium',hard:'Hard',expert:'Expert',erase:'Erase',note:'Add mark',refine:'Refine notes',autonotes:'Auto notes',pastels:'Number colors',undo:'Undo',redo:'Redo',hint:'Hint',check:'Check numbers',save:'New game on every launch',done:'Sudoku solved!',ok:'No conflicts',wrong:'Incorrect numbers',confirm:'Start a new game?'}};
let lang='fi',puzzle=[],solution=[],values=[],notes=[],selected=-1,noteMode=false,autoNotes=false,refineNotes=false,notesVisible=false,manualExcluded=Array.from({length:81},()=>[]),activeDigit=0,history=[],future=[],seconds=0,timer;
const $=id=>document.getElementById(id),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function candidates(b,i){if(b[i])return [];let r=Math.floor(i/9),c=i%9,used=new Set;for(let k=0;k<9;k++){used.add(b[r*9+k]);used.add(b[k*9+c]);used.add(b[(Math.floor(r/3)*3+Math.floor(k/3))*9+Math.floor(c/3)*3+k%3])}return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}
function solve(b,limit=1,random=false){let count=0,first=null;function rec(){let idx=-1,opts=null;for(let i=0;i<81;i++)if(!b[i]){let c=candidates(b,i);if(!c.length)return;if(!opts||c.length<opts.length){idx=i;opts=c;if(c.length===1)break}}if(idx<0){count++;if(!first)first=[...b];return}for(let n of random?shuffle(opts):opts){b[idx]=n;rec();if(count>=limit){b[idx]=0;return}b[idx]=0}}rec();return {count,first}}
function generate(level){let full=solve(Array(81).fill(0),1,true).first;let b=[...full],target={easy:40,medium:33,hard:27,expert:23}[level];for(let i of shuffle([...Array(81).keys()])){if(b.filter(Boolean).length<=target)break;let old=b[i];b[i]=0;if(solve([...b],2).count!==1)b[i]=old}return {b,full}}
function reduceBoxSingles(){
 if(!autoNotes)return;
 for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){
   const cells=[];
   for(let r=br*3;r<br*3+3;r++)for(let col=bc*3;col<bc*3+3;col++)cells.push(r*9+col);
   for(let n=1;n<=9;n++){
     if(cells.some(i=>values[i]===n))continue;
     const possible=cells.filter(i=>!values[i]&&candidates(values,i).includes(n));
     if(possible.length!==1)continue;
     const i=possible[0];
     if((notes[i]||[]).includes(n))notes[i]=[n];
   }
 }
}
function syncAutoNotes(){
 if(!autoNotes)return;
 const before=notes.map(a=>[...a]);
 if(!refineNotes)for(let i=0;i<81;i++)notes[i]=values[i]?[]:candidates(values,i).filter(n=>!manualExcluded[i].includes(n));
 if(refineNotes){
   refineCandidateNotes(true);
   let removed=0;
   for(let i=0;i<81;i++){
     removed+=before[i].filter(n=>!notes[i].includes(n)).length;
   }
   $('status').textContent=({fi:'Merkintöjä poistettu: '+removed,hu:'Jelölések törölve: '+removed,en:'Marks removed: '+removed})[lang];
 }
 reduceBoxSingles();
}
function removeCandidate(i,n){if(i<0||i>=81||values[i]||n<1||n>9)return;const a=notes[i]||[];if(!a.includes(n))return;notes[i]=a.filter(x=>x!==n);if(!manualExcluded[i].includes(n))manualExcluded[i].push(n);notesVisible=true;render();save()}
// Locked candidates (pointing pairs/triples): if a digit's candidates in one
// 3x3 box lie entirely in one row/column, remove it from that line outside box.
// Also apply claiming: a row/column confined to one box eliminates other box cells.
function refineCandidateNotes(silent=false){
  
  const before=notes.map(a=>[...a]);
  // Rebuild all currently legal candidates, including accidentally missing marks.
  // The refinement mode deliberately overrides manual exclusions.
  const work=values.map((v,i)=>v?new Set():new Set((notes[i]||[]).filter(n=>candidates(values,i).includes(n))));
  const boxes=Array.from({length:9},(_,b)=>Array.from({length:9},(_,k)=>(Math.floor(b/3)*3+Math.floor(k/3))*9+(b%3)*3+k%3));
  const rows=Array.from({length:9},(_,r)=>Array.from({length:9},(_,k)=>r*9+k));
  const cols=Array.from({length:9},(_,col)=>Array.from({length:9},(_,r)=>r*9+col));
  let changed=true,rounds=0;
  while(changed&&rounds++<20){
    changed=false;
    const groups=[...boxes,...rows,...cols];
    for(let g=0;g<groups.length;g++){
      const unit=groups[g],kind=g<9?'box':g<18?'row':'col';
      for(let n=1;n<=9;n++){
        if(unit.some(i=>values[i]===n))continue;
        const places=unit.filter(i=>work[i].has(n));
        if(places.length<2)continue;
        const targetUnits=kind==='box'?[rows[Math.floor(places[0]/9)],cols[places[0]%9]]:kind==='row'?boxes.filter(b=>b.includes(places[0])):boxes.filter(b=>b.includes(places[0]));
        for(const target of targetUnits){
          if(!places.every(i=>target.includes(i)))continue;
          for(const i of target)if(!unit.includes(i)&&work[i].delete(n))changed=true;
        }
      }
    }
  }
  let removed=0;
  for(let i=0;i<81;i++){
    removed+=before[i].filter(n=>!work[i].has(n)).length;
    notes[i]=[...work[i]].sort((a,b)=>a-b);
  }
  if(silent)return;
  render();save();
  $('status').textContent=({fi:'Merkintöjä poistettu: '+removed,hu:'Jelölések törölve: '+removed,en:'Marks removed: '+removed})[lang];
}
function snapshot(){return {values:[...values],notes:notes.map(x=>[...x])}}function restore(s){values=[...s.values];notes=s.notes.map(x=>[...x]);syncAutoNotes();render();save()}
function change(i,n){if(i<0||puzzle[i])return;
 if(noteMode&&n>0){
   if(values[i])return;
   let s=new Set(notes[i]);s.has(n)?s.delete(n):s.add(n);
   notes[i]=[...s].sort((a,b)=>a-b);
   if(autoNotes){if(s.has(n))manualExcluded[i]=manualExcluded[i].filter(x=>x!==n);else if(!manualExcluded[i].includes(n))manualExcluded[i].push(n)}
   reduceBoxSingles();render();save();return;
 }
 history.push(snapshot());future=[];values[i]=n;notes[i]=[];manualExcluded[i]=[];syncAutoNotes();render();save();completed()}
function save(){localStorage.setItem('sisko-sudoku-v1',JSON.stringify({puzzle,solution,values,notes,autoNotes,refineNotes,notesVisible,manualExcluded,seconds,level:$('difficulty').value}))}
function render(){updateNumberKeys();$('note').classList.toggle('active',noteMode);$('note').setAttribute('aria-pressed',String(noteMode));$('note').textContent=({fi:'Lisää merkintä',hu:'Jelölés hozzáadása',en:'Add mark'})[$('lang').value]+' '+(noteMode?'ON':'OFF');for(const b of $('numbers').children)b.classList.toggle('active-digit',Number(b.textContent)===activeDigit);$('autonotes').classList.toggle('active',autoNotes);$('autonotes').setAttribute('aria-pressed',String(autoNotes));$('autonotes').textContent=({fi:'Automaattiset merkinnät',hu:'Automatikus jelölések',en:'Automatic marks'})[$('lang').value]+' '+(autoNotes?'ON':'OFF');$('refine-notes').classList.toggle('active',refineNotes);$('refine-notes').setAttribute('aria-pressed',String(refineNotes));$('hide-notes').classList.toggle('active',!notesVisible);$('hide-notes').textContent=notesVisible?({fi:'Piilota merkinnät',hu:'Jegyzetek elrejtése',en:'Hide notes'}[$('lang').value]):({fi:'Näytä merkinnät',hu:'Jegyzetek mutatása',en:'Show notes'}[$('lang').value]);$('autonotes').setAttribute('aria-pressed',String(autoNotes));$('clear-cell').classList.toggle('active-digit',activeDigit===-1);let board=$('board');board.replaceChildren();for(let i=0;i<81;i++){let e=document.createElement('div');e.className='cell'+(puzzle[i]?' given':'');if(i===selected)e.classList.add('selected');else if(selected>=0&&(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9||(Math.floor(i/27)===Math.floor(selected/27)&&Math.floor(i%9/3)===Math.floor(selected%9/3))))e.classList.add('related');if((activeDigit||selected>=0&&values[selected])&&values[i]===(activeDigit||values[selected])&&i!==selected)e.classList.add('same');if(values[i]&&values[i]!==solution[i]&&!puzzle[i]&&showErrors)e.classList.add('error');if(values[i])e.textContent=values[i];else if(notesVisible&&notes[i]?.length){let grid=document.createElement('div');grid.className='notes';for(let n=1;n<=9;n++){let span=document.createElement('span');span.textContent=notes[i].includes(n)?n:'';grid.append(span)}e.append(grid)}e.addEventListener('pointerdown',ev=>{ev.preventDefault();selected=i;if(activeDigit===-1&&!values[i]&&notesVisible&&notes[i]?.length){
        const rect=e.getBoundingClientRect(),x=(ev.clientX-rect.left)/rect.width,y=(ev.clientY-rect.top)/rect.height;
        const col=Math.max(0,Math.min(2,Math.floor(x*3))),row=Math.max(0,Math.min(2,Math.floor(y*3)));
        const digit=row*3+col+1;
        removeCandidate(i,digit);
      }else if(activeDigit===-1&&!puzzle[i])change(i,0);
      else if(activeDigit>0&&!puzzle[i]&&!values[i])change(i,activeDigit);
      else render()},{passive:false});board.append(e)}}
function updateNumberKeys(){const counts=Array(10).fill(0);for(const n of values)if(n>=1&&n<=9)counts[n]++;for(const b of $('numbers').children){const n=Number(b.textContent);const used=counts[n]>=9;b.classList.toggle('exhausted',used);b.setAttribute('aria-label',n+' ('+counts[n]+'/9)');b.setAttribute('aria-disabled',String(used));}}let showErrors=false;document.addEventListener('contextmenu',e=>{if(e.target.closest('.board,.nums,.actions'))e.preventDefault()});document.addEventListener('selectstart',e=>{if(e.target.closest('.board,.nums,.actions'))e.preventDefault()});
function completed(){if(values.every((v,i)=>v===solution[i])){$('status').textContent=dict[lang].done;clearInterval(timer)}}
function newGame(){let g=generate($('difficulty').value);puzzle=g.b;solution=g.full;values=[...puzzle];notes=Array.from({length:81},()=>[]);manualExcluded=Array.from({length:81},()=>[]);selected=-1;activeDigit=0;history=[];future=[];seconds=0;showErrors=false;autoNotes=false;refineNotes=false;notesVisible=false;noteMode=false;syncAutoNotes();$('status').textContent='';render();save()}
function translate(){let d=dict[lang];$('title').textContent=d.title;for(let id of ['new','hint','check'])$(id).textContent=d[id];for(let opt of $('difficulty').options)opt.textContent=d[opt.value];$('footer').textContent=d.save;$('clear-cell').setAttribute('aria-label',lang==='fi'?'Tyhjennä ruutu':lang==='hu'?'Cella törlése':'Clear cell');$('refine-notes').textContent=d.refine;$('help-notes').textContent=({fi:'Ohje',hu:'Súgó',en:'Help'})[lang];$('new-confirm-text').textContent=d.confirm;$('new-yes').textContent=({fi:'Aloita uusi',hu:'Új játék indítása',en:'Start new'})[lang];$('new-no').textContent=({fi:'Peruuta',hu:'Mégse',en:'Cancel'})[lang];$('note').textContent=d.note+' '+(noteMode?'ON':'OFF');$('autonotes').textContent=({fi:'Automaattiset merkinnät',hu:'Automatikus jelölések',en:'Automatic marks'})[lang]+' '+(autoNotes?'ON':'OFF');document.documentElement.lang=lang}
$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('sudoku-lang',lang);translate()};
$('new').onclick=()=>{$('new-confirm').hidden=false};$('new-yes').onclick=()=>{$('new-confirm').hidden=true;newGame()};$('new-no').onclick=()=>{$('new-confirm').hidden=true};
$('numbers').replaceChildren();for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(!noteMode&&values.filter(v=>v===n).length>=9)return;activeDigit=n;if(selected>=0&&!puzzle[selected]&&!values[selected])change(selected,n);else render()};$('numbers').append(b)}
$('autonotes').onclick=()=>{autoNotes=!autoNotes;if(autoNotes){notesVisible=true;syncAutoNotes()}else refineNotes=false;render();save()};$('hide-notes').onclick=()=>{notesVisible=!notesVisible;render();save()};$('note').onclick=()=>{noteMode=!noteMode;if(noteMode){notesVisible=true;if(activeDigit===-1)activeDigit=0}render();save()};$('help-notes').onclick=()=>{const e=$('notes-help');e.hidden=!e.hidden;if(!e.hidden)e.textContent=({fi:'Näytä/Piilota merkinnät ohjaa vain merkintöjen näkyvyyttä. Lisää merkintä on erillinen ON/OFF-toiminto eikä muuta näkyvyyttä. Kun se on päällä, valitse numero oikealta ja kosketa ruutua lisätäksesi tai poistaaksesi pienen merkinnän. Normaalitilassa numerot sijoitetaan varsinaisiksi numeroiksi. ⌫ poistaa valitun varsinaisen numeron tai tarkasti kosketetun pienen merkinnän. Automaattiset merkinnät täyttää ehdokkaat, Tarkista merkinnät täydentää puuttuvat ja poistaa loogisesti mahdottomat.',hu:'Jelölés törlése: válaszd a ⌫ gombot, majd érintsd meg pontosan a kis számot. Az ellenőrzés a hiányzó lehetőségeket is pótolja.',en:'To erase a pencil mark, select ⌫ on the right and tap the exact small digit in its cell. Check marks also restores missing valid candidates and removes logically excluded ones after each entry.'})[lang]};$('refine-notes').onclick=()=>{refineNotes=!refineNotes;if(refineNotes){notesVisible=true;refineCandidateNotes(false)}render();save()};$('clear-cell').onclick=()=>{activeDigit=-1;if(selected>=0&&!puzzle[selected]&&values[selected])change(selected,0);render()};


$('hint').onclick=()=>{let i=selected>=0&&!puzzle[selected]&&values[selected]!==solution[selected]?selected:values.findIndex((v,j)=>v!==solution[j]);if(i>=0){selected=i;let was=noteMode;noteMode=false;change(i,solution[i]);noteMode=was;render()}};
$('check').onclick=()=>{showErrors=true;render();$('status').textContent=values.some((v,i)=>v&&v!==solution[i])?dict[lang].wrong:dict[lang].ok;completed()};
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9'){activeDigit=+e.key;change(selected,+e.key)}else if(e.key==='Backspace'||e.key==='Delete')change(selected,0);else if(selected>=0&&e.key.startsWith('Arrow')){e.preventDefault();selected=Math.max(0,Math.min(80,selected+({ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key]||0)));render()}});

newGame();
lang=localStorage.getItem('sudoku-lang')||'fi';$('lang').value=lang;translate();timer=setInterval(()=>{seconds++;save()},1000);
