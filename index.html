<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#163a69"><title>Siskon parempi sudoku</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eef3fa;background:#152334}*{box-sizing:border-box}body{margin:0;padding:12px}main{max-width:540px;margin:auto}h1{text-align:center;font-size:1.55rem;margin:12px 0 4px}.sub{text-align:center;color:#a9b8c9;font-size:12px;margin-bottom:16px}.toolbar,.actions,.nums{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px 0}button,select{font:inherit;border:1px solid #53677d;background:#273e56;color:white;border-radius:9px;padding:10px;touch-action:manipulation}button:active{background:#496989}.active{background:#246e88!important}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;border:3px solid #dbe7f5;background:#e4edf8;user-select:none;touch-action:manipulation}.cell{position:relative;display:grid;place-items:center;border-right:1px solid #9aafc3;border-bottom:1px solid #9aafc3;color:#18314c;font-size:clamp(17px,5vw,29px);font-weight:500;min-width:0}.cell:nth-child(3n){border-right:2px solid #344c65}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #344c65}.given{font-weight:800;color:#10273d}.selected{background:#9dd7ee!important}.related{background:#c7dfed}.same{background:#aed3df}.error{color:#c32636!important;background:#f5c3c7!important}.notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;align-items:center;text-align:center;font-size:clamp(8px,2vw,12px);color:#3d617f}.nums button{flex:1;min-width:8%;font-size:22px;padding:11px 0}.actions button{font-size:14px}.status{text-align:center;min-height:25px;color:#bcd3e6}.footer{text-align:center;color:#839bb1;font-size:12px;margin-top:15px}

/* v0.2.0: colorful tactile 3D board and iPad touch handling */
html,body,main,.board,.cell,.nums,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{background:radial-gradient(ellipse at 15% 0%,#395cc2 0%,#172c68 43%,#101c42 100%);min-height:100%}
body{background:transparent;min-height:100vh}
main{max-width:590px;padding:12px 14px 20px;border-radius:24px;background:linear-gradient(155deg,#314f9a99,#1b2b6499);box-shadow:0 20px 55px #070f3488,inset 0 2px 2px #ffffff33}
h1{color:#fff;text-shadow:0 3px 5px #070d3d;font-size:clamp(23px,5vw,32px)}
.sub{color:#bdeaff}
.board{border:6px solid #d8e8ff;border-radius:12px;overflow:hidden;background:#d7ecff;box-shadow:0 13px 0 #071c47,0 19px 30px #050c2b88,inset 0 2px 5px #ffffff}
.cell{background:linear-gradient(150deg,#f8fdff,#d7e9fa);border-color:#9fb6d5;box-shadow:inset 1px 1px 0 #ffffffbb;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cell:nth-child(3n){border-right-color:#35568a}
.cell.selected{background:linear-gradient(145deg,#ffe99b,#ffb64b)!important;box-shadow:inset 0 3px 8px #c96c2588,0 0 0 2px #fff3b2;z-index:1}
.cell.related{background:linear-gradient(145deg,#d5f5fc,#a9d9ef)}
.cell.same{background:linear-gradient(145deg,#d0f9d4,#8bdcaa)}
.cell.given{color:#1d3974;text-shadow:0 1px #fff}
button,select{background:linear-gradient(180deg,#58baf7,#1767b4);border:1px solid #8dd8ff;border-bottom:4px solid #104579;box-shadow:0 4px 10px #071b4988;color:#fff;font-weight:700;text-shadow:0 1px 1px #153a70}
button:active{transform:translateY(2px);border-bottom-width:2px}
.nums{gap:5px;flex-wrap:nowrap;margin:10px 0 17px}.nums button{min-width:0;flex:1;font-size:clamp(17px,4vw,25px);padding:12px 0;background:linear-gradient(170deg,#fff2a7,#f2a93d);color:#563000;border-color:#fff2c4;border-bottom-color:#a96616;text-shadow:none}
.actions button{background:linear-gradient(180deg,#9b78ee,#5c3da8);border-color:#d6bfff;border-bottom-color:#3a257b}
.status{color:#fff1a8}

/* v0.2.2 cheerful colorful 3D theme */
html{background:radial-gradient(circle at 10% 0%,#ffdb78 0%,#ff8b9e 24%,#7c78e9 60%,#30b5ca 100%);background-attachment:fixed}
main{background:linear-gradient(155deg,#ffffffeb,#e7faffeb);box-shadow:0 20px 55px #382d7370,inset 0 2px 3px #fff;border:2px solid #ffffffa8}
h1{color:#25427c;text-shadow:0 2px #fff;font-weight:850}
.sub{color:#6b519b;font-weight:700}
.board{border-color:#fff;box-shadow:0 12px 0 #4770aa,0 18px 25px #29466d65}
.cell{background:linear-gradient(145deg,#fffdf8,#e4f4ff)}
.cell:nth-child(18n+1),.cell:nth-child(18n+2),.cell:nth-child(18n+3),.cell:nth-child(18n+10),.cell:nth-child(18n+11),.cell:nth-child(18n+12){background:linear-gradient(145deg,#fff6dc,#ffe9ed)}
.cell.selected{background:linear-gradient(145deg,#fff59b,#ffba42)!important}
.cell.related{background:linear-gradient(145deg,#c9f5fa,#a9e6ed)!important}
.cell.same{background:linear-gradient(145deg,#c7f9cd,#9de6ad)!important}
button,select{background:linear-gradient(180deg,#48d4ec,#178ebf);border-color:#9cf2ff;border-bottom-color:#12618a}
.nums button{background:linear-gradient(165deg,#fff7ad,#ffb947);color:#713c17;border-color:#fff8c8;border-bottom-color:#cf7829;box-shadow:0 5px 10px #9a5b3466}
.nums button:nth-child(3n+2){background:linear-gradient(165deg,#baf9f0,#46d6c2);border-color:#d5fff8;border-bottom-color:#188d8a;color:#155c65}
.nums button:nth-child(3n){background:linear-gradient(165deg,#ffd2f1,#ff8ac0);border-color:#ffe6f5;border-bottom-color:#b94891;color:#702b64}
.actions button:nth-child(3n+1){background:linear-gradient(180deg,#ff91b9,#df4d91);border-color:#ffc8dd;border-bottom-color:#a42f70}
.actions button:nth-child(3n+2){background:linear-gradient(180deg,#a991f7,#7454d1);border-color:#e0d2ff;border-bottom-color:#5034a0}
.actions button:nth-child(3n){background:linear-gradient(180deg,#65d9ae,#23a58c);border-color:#b0f8d8;border-bottom-color:#147967}
.status{color:#285d86;font-weight:700}.footer{color:#6475a1}

/* v0.2.3: vertical number keypad beside board */
.game-area{display:grid;grid-template-columns:minmax(0,1fr) clamp(42px,10vw,58px);align-items:stretch;gap:8px;margin:12px 0 18px}
.game-area .board{width:100%;min-width:0;margin:0}
.game-area .nums{display:grid;grid-template-columns:1fr;grid-template-rows:repeat(9,minmax(0,1fr));gap:4px;margin:0;min-width:0}
.game-area .nums button{width:100%;min-width:0;min-height:0;padding:0;font-size:clamp(16px,3.7vw,24px);line-height:1;display:grid;place-items:center}
.game-area .nums button.exhausted{filter:grayscale(1) brightness(.72);opacity:.48;box-shadow:none;border-bottom-width:1px}
.game-area .nums button.exhausted:active{transform:none}
@media(max-width:390px){main{padding:8px}.game-area{gap:5px;grid-template-columns:minmax(0,1fr) 38px}.game-area .nums{gap:2px}}
.actions button.active{background:linear-gradient(180deg,#27d4a6,#087e72)!important;border-color:#b5ffe6!important;border-bottom-color:#07594f!important}


.game-area .nums button.active-digit{outline:3px solid #ffffff;outline-offset:-3px;box-shadow:0 0 0 3px #3c64b7,0 4px 12px #314985a8;filter:saturate(1.3)}

/* v0.2.8 PWA board sizing: keep all 9 rows visible without clipping */
.game-area{align-items:start}
.game-area .board{aspect-ratio:1/1;box-sizing:border-box;overflow:visible;border-width:3px;box-shadow:0 7px 0 #4770aa,0 12px 18px #29466d55}
.game-area .cell{min-height:0;min-width:0;overflow:hidden;box-shadow:none}
.game-area .cell.selected{box-shadow:inset 0 0 0 2px #f6ac2c}
.game-area .nums{height:100%;align-self:stretch}
.cell{font-size:clamp(14px,4.5vw,27px)}
@media(max-width:480px){body{padding:5px}main{padding:9px 8px 18px}.game-area{gap:6px;grid-template-columns:minmax(0,1fr) 40px}.board{border-radius:7px}.game-area .nums button{font-size:18px}}

/* v0.2.9 neutral numeric controls; preserve board grid */
.game-area .nums button,.game-area .nums button:nth-child(3n),.game-area .nums button:nth-child(3n+2){background:linear-gradient(180deg,#f6f8fb,#d7e1ed);color:#233c60;border:1px solid #ffffff;border-bottom:3px solid #8a9cb2;text-shadow:none;box-shadow:0 2px 5px #64758a44}
.game-area .nums button.active-digit{background:linear-gradient(180deg,#e6f1ff,#a9c8f3);outline:2px solid #356ab4;outline-offset:-2px}
.game-area .nums button.exhausted{filter:grayscale(1);opacity:.4}
.game-area .cell{color:#203c65}

/* v0.3.0: side column with erase key below 1–9 */
.game-area{grid-template-columns:minmax(0,1fr) clamp(42px,10vw,58px)}
.game-area .number-side{display:flex;flex-direction:column;gap:6px;min-width:0;align-self:stretch}
.game-area .number-side .nums{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(9,minmax(0,1fr));gap:4px}
.game-area .number-side #clear-cell{height:clamp(32px,8vw,52px);padding:0;display:grid;place-items:center;font-size:24px;background:linear-gradient(180deg,#f6f8fb,#d7e1ed);color:#233c60;border:1px solid white;border-bottom:3px solid #8a9cb2;text-shadow:none}
.game-area .number-side #clear-cell.active-digit{background:#b8d8fa;outline:2px solid #356ab4}
@media(max-width:480px){.game-area{grid-template-columns:minmax(0,1fr) 40px}.game-area .number-side{gap:3px}}
</style></head><body><main><h1 id="title">Siskon parempi sudoku</h1><div class="sub">Testiversio 0.3.2</div><div class="toolbar"><select id="lang" aria-label="Language"><option value="fi">Suomi</option><option value="hu">Magyar</option><option value="en">English</option></select><select id="difficulty"><option value="easy">Helppo</option><option value="medium">Keskitaso</option><option value="hard">Vaikea</option><option value="expert">Erittäin vaikea</option></select><button id="new">Uusi peli</button></div><div class="status" id="status"></div><div class="game-area"><div class="board" id="board" role="grid" aria-label="Sudoku"></div><div class="number-side"><div class="nums" id="numbers"></div><button id="clear-cell" aria-label="Tyhjennä ruutu">⌫</button></div></div><div class="actions"><button id="note">Muistiinpanot</button><button id="autonotes">Automaattiset muistiinpanot</button><button id="hide-notes">Piilota muistiinpanot</button><button id="hint">Vihje</button><button id="check">Tarkista</button></div><div class="footer" id="footer">Peli tallentuu automaattisesti</div></main>
<script>
const dict={fi:{title:'Siskon parempi sudoku',new:'Uusi peli',easy:'Helppo',medium:'Keskitaso',hard:'Vaikea',expert:'Erittäin vaikea',erase:'Pyyhi',note:'Muistiinpanot',autonotes:'Autom. muistiinpanot',pastels:'Numerovärit',undo:'Kumoa',redo:'Tee uudelleen',hint:'Vihje',check:'Tarkista',save:'Peli tallentuu automaattisesti',done:'Sudoku ratkaistu!',ok:'Ei ristiriitoja',wrong:'Virheellisiä numeroita',confirm:'Aloitetaanko uusi peli?'},hu:{title:'Sisko jobb sudokuje',new:'Új játék',easy:'Könnyű',medium:'Közepes',hard:'Nehéz',expert:'Nagyon nehéz',erase:'Törlés',note:'Jegyzetek',autonotes:'Automatikus jegyzetek',pastels:'Színes számok',undo:'Visszavonás',redo:'Újra',hint:'Tipp',check:'Ellenőrzés',save:'Automatikus mentés',done:'Sudoku megoldva!',ok:'Nincs ütközés',wrong:'Hibás számok',confirm:'Új játék induljon?'},en:{title:"Sisko's Better Sudoku",new:'New game',easy:'Easy',medium:'Medium',hard:'Hard',expert:'Expert',erase:'Erase',note:'Notes',autonotes:'Auto notes',pastels:'Number colors',undo:'Undo',redo:'Redo',hint:'Hint',check:'Check',save:'Saved automatically',done:'Sudoku solved!',ok:'No conflicts',wrong:'Incorrect numbers',confirm:'Start a new game?'}};
let lang='fi',puzzle=[],solution=[],values=[],notes=[],selected=-1,noteMode=false,autoNotes=false,pastels=true,activeDigit=0,history=[],future=[],seconds=0,timer;
const $=id=>document.getElementById(id),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function candidates(b,i){if(b[i])return [];let r=Math.floor(i/9),c=i%9,used=new Set;for(let k=0;k<9;k++){used.add(b[r*9+k]);used.add(b[k*9+c]);used.add(b[(Math.floor(r/3)*3+Math.floor(k/3))*9+Math.floor(c/3)*3+k%3])}return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))}
function solve(b,limit=1,random=false){let count=0,first=null;function rec(){let idx=-1,opts=null;for(let i=0;i<81;i++)if(!b[i]){let c=candidates(b,i);if(!c.length)return;if(!opts||c.length<opts.length){idx=i;opts=c;if(c.length===1)break}}if(idx<0){count++;if(!first)first=[...b];return}for(let n of random?shuffle(opts):opts){b[idx]=n;rec();if(count>=limit){b[idx]=0;return}b[idx]=0}}rec();return {count,first}}
function generate(level){let full=solve(Array(81).fill(0),1,true).first;let b=[...full],target={easy:40,medium:33,hard:27,expert:23}[level];for(let i of shuffle([...Array(81).keys()])){if(b.filter(Boolean).length<=target)break;let old=b[i];b[i]=0;if(solve([...b],2).count!==1)b[i]=old}return {b,full}}
function syncAutoNotes(){if(!autoNotes)return;for(let i=0;i<81;i++)notes[i]=values[i]?[]:candidates(values,i)}function snapshot(){return {values:[...values],notes:notes.map(x=>[...x])}}function restore(s){values=[...s.values];notes=s.notes.map(x=>[...x]);syncAutoNotes();render();save()}
function change(i,n){if(i<0||puzzle[i])return;history.push(snapshot());future=[];if(noteMode&&!autoNotes&&n){let s=new Set(notes[i]);s.has(n)?s.delete(n):s.add(n);notes[i]=[...s].sort();values[i]=0}else{values[i]=n;notes[i]=[]}syncAutoNotes();render();save();completed()}
function save(){localStorage.setItem('sisko-sudoku-v1',JSON.stringify({puzzle,solution,values,notes,autoNotes,notesVisible,seconds,level:$('difficulty').value}))}
function render(){updateNumberKeys();for(const b of $('numbers').children)b.classList.toggle('active-digit',Number(b.textContent)===activeDigit);$('autonotes').classList.toggle('active',autoNotes);$('hide-notes').classList.toggle('active',!notesVisible);$('hide-notes').textContent=notesVisible?({fi:'Piilota muistiinpanot',hu:'Jegyzetek elrejtése',en:'Hide notes'}[$('lang').value]):({fi:'Näytä muistiinpanot',hu:'Jegyzetek mutatása',en:'Show notes'}[$('lang').value]);$('autonotes').setAttribute('aria-pressed',String(autoNotes));$('clear-cell').classList.toggle('active-digit',activeDigit===-1);let board=$('board');board.replaceChildren();for(let i=0;i<81;i++){let e=document.createElement('div');e.className='cell'+(puzzle[i]?' given':'');if(i===selected)e.classList.add('selected');else if(selected>=0&&(Math.floor(i/9)===Math.floor(selected/9)||i%9===selected%9||(Math.floor(i/27)===Math.floor(selected/27)&&Math.floor(i%9/3)===Math.floor(selected%9/3))))e.classList.add('related');if((activeDigit||selected>=0&&values[selected])&&values[i]===(activeDigit||values[selected])&&i!==selected)e.classList.add('same');if(values[i]&&values[i]!==solution[i]&&!puzzle[i]&&showErrors)e.classList.add('error');if(values[i])e.textContent=values[i];else if(notesVisible&&notes[i]?.length){let grid=document.createElement('div');grid.className='notes';for(let n=1;n<=9;n++){let span=document.createElement('span');span.textContent=notes[i].includes(n)?n:'';grid.append(span)}e.append(grid)}e.addEventListener('pointerdown',ev=>{ev.preventDefault();selected=i;if(activeDigit===-1&&!puzzle[i])change(i,0);else if(activeDigit>0&&!puzzle[i]&&!values[i])change(i,activeDigit);else render()},{passive:false});board.append(e)}$('note').classList.toggle('active',noteMode)}
function updateNumberKeys(){const counts=Array(10).fill(0);for(const n of values)if(n>=1&&n<=9)counts[n]++;for(const b of $('numbers').children){const n=Number(b.textContent);const used=counts[n]>=9;b.classList.toggle('exhausted',used);b.setAttribute('aria-label',n+' ('+counts[n]+'/9)');b.setAttribute('aria-disabled',String(used));}}let showErrors=false;document.addEventListener('contextmenu',e=>{if(e.target.closest('.board,.nums,.actions'))e.preventDefault()});document.addEventListener('selectstart',e=>{if(e.target.closest('.board,.nums,.actions'))e.preventDefault()});
function completed(){if(values.every((v,i)=>v===solution[i])){$('status').textContent=dict[lang].done;clearInterval(timer)}}
function newGame(){let g=generate($('difficulty').value);puzzle=g.b;solution=g.full;values=[...puzzle];notes=Array.from({length:81},()=>[]);selected=-1;activeDigit=0;history=[];future=[];seconds=0;showErrors=false;syncAutoNotes();$('status').textContent='';render();save()}
function translate(){let d=dict[lang];$('title').textContent=d.title;for(let id of ['new','note','autonotes','hint','check'])$(id).textContent=d[id];for(let opt of $('difficulty').options)opt.textContent=d[opt.value];$('footer').textContent=d.save;$('clear-cell').setAttribute('aria-label',lang==='fi'?'Tyhjennä ruutu':lang==='hu'?'Cella törlése':'Clear cell');document.documentElement.lang=lang}
$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('sudoku-lang',lang);translate()};
$('new').onclick=()=>{if(confirm(dict[lang].confirm))newGame()};
$('numbers').replaceChildren();for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(values.filter(v=>v===n).length>=9)return;activeDigit=n;if(selected>=0&&!puzzle[selected]&&!values[selected])change(selected,n);else render()};$('numbers').append(b)}
$('autonotes').onclick=()=>{autoNotes=!autoNotes;if(autoNotes){noteMode=false;notesVisible=true;syncAutoNotes()}render();save()};$('hide-notes').onclick=()=>{notesVisible=!notesVisible;render();save()};$('clear-cell').onclick=()=>{activeDigit=-1;if(selected>=0&&!puzzle[selected])change(selected,0);render()};$('note').onclick=()=>{noteMode=!noteMode;if(noteMode){autoNotes=false;notesVisible=true}render();save()};


$('hint').onclick=()=>{let i=selected>=0&&!puzzle[selected]&&values[selected]!==solution[selected]?selected:values.findIndex((v,j)=>v!==solution[j]);if(i>=0){selected=i;let was=noteMode;noteMode=false;change(i,solution[i]);noteMode=was;render()}};
$('check').onclick=()=>{showErrors=true;render();$('status').textContent=values.some((v,i)=>v&&v!==solution[i])?dict[lang].wrong:dict[lang].ok;completed()};
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9'){activeDigit=+e.key;change(selected,+e.key)}else if(e.key==='Backspace'||e.key==='Delete')change(selected,0);else if(selected>=0&&e.key.startsWith('Arrow')){e.preventDefault();selected=Math.max(0,Math.min(80,selected+({ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key]||0)));render()}});
try{let s=JSON.parse(localStorage.getItem('sisko-sudoku-v1'));if(s&&s.puzzle?.length===81&&s.solution?.length===81){({puzzle,solution,values,notes,seconds}=s);autoNotes=!!s.autoNotes;notesVisible=s.notesVisible!==false;noteMode=false;syncAutoNotes();$('difficulty').value=s.level||'easy';render()}else newGame()}catch(e){newGame()}
lang=localStorage.getItem('sudoku-lang')||'fi';$('lang').value=lang;translate();timer=setInterval(()=>{seconds++;save()},1000);
</script></body></html>
